<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产展示间 · 离线</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎋</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #121517; color: #e6edf0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #shell { display: flex; height: 100%; }
  #side {
    width: 260px; flex: 0 0 260px; background: #171b1e; border-right: 1px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column; min-height: 0;
  }
  #side header { padding: 18px 18px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  #side header h1 { font-size: 16px; font-weight: 500; letter-spacing: 2px; }
  #side header p { font-size: 11px; color: #7f9398; margin-top: 4px; letter-spacing: 1px; }
  #groups { flex: 1; overflow-y: auto; padding: 10px 10px 16px; }
  .group { margin-bottom: 6px; }
  .group-title { font-size: 12px; color: #9fb2b7; padding: 8px 8px 4px; letter-spacing: 1px; display: flex; justify-content: space-between; }
  .group-title span { color: #5d7076; font-size: 10px; }
  .item {
    width: 100%; text-align: left; background: rgba(255,255,255,0.03); border: 1px solid transparent;
    border-radius: 8px; padding: 8px 10px; cursor: pointer; color: #dce7ea; font-size: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .item:hover:not(:disabled) { background: rgba(255,255,255,0.07); }
  .item.active { background: #293f35; border-color: #5fd193; }
  .item.pending { opacity: 0.42; cursor: help; }
  .item .status { font-size: 10px; color: #8fa3a8; white-space: nowrap; }
  .item.active .status { color: #a9e6c8; }
  #side footer { padding: 12px 16px; font-size: 10px; color: #63767b; border-top: 1px solid rgba(255,255,255,0.06); line-height: 1.5; }
  #stage { position: relative; flex: 1; min-width: 0; }
  #view { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 14px; right: 14px; width: 264px; max-height: calc(100% - 28px); overflow-y: auto;
    background: rgba(18,22,24,0.86); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 14px;
  }
  #title { font-size: 15px; letter-spacing: 1px; }
  #badge { display: inline-block; margin-top: 6px; font-size: 10px; padding: 2px 8px; border-radius: 9px; background: #2f4a3f; color: #7de8b0; }
  #params { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .param label { display: flex; justify-content: space-between; font-size: 11px; color: #a9bcc1; margin-bottom: 4px; }
  .param label b { color: #6f858a; font-weight: 400; }
  .param input[type=range] { width: 100%; accent-color: #5fd193; }
  .param select { width: 100%; background: #1d2428; color: #dce7ea; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 5px 6px; font-size: 12px; }
  .param .toggle { display: flex; align-items: center; gap: 8px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .row button {
    flex: 1; background: #2a473b; color: #eafff5; border: 1px solid #5fd193; border-radius: 8px;
    padding: 8px 0; font-size: 12px; letter-spacing: 1px; cursor: pointer;
  }
  .row button.ghost { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.16); color: #c8d7da; }
  .row button:disabled { opacity: 0.4; cursor: default; }
  #note { margin-top: 10px; font-size: 10px; color: #7f9398; line-height: 1.6; }
  #status { margin-top: 8px; font-size: 10px; color: #5fd193; min-height: 14px; }
  #stageMsg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(20,26,29,0.92); border: 1px solid rgba(255,255,255,0.16);
    color: #cfe0e4; font-size: 13px; letter-spacing: 1px; padding: 14px 22px; border-radius: 10px;
    pointer-events: none; text-align: center; max-width: 70%;
  }
</style>
</head>
<body>
<div id="shell">
  <aside id="side">
    <header>
      <h1>资产展示间</h1>
      <p>离线渲染器 · 单组件</p>
    </header>
    <div id="groups"></div>
    <footer>目录共用 shared/data/gallery.js<br>加组件 = 目录加一条 + 本端注册一行</footer>
  </aside>
  <main id="stage">
    <canvas id="view"></canvas>
    <div id="stageMsg" hidden></div>
    <div id="hud">
      <div id="title">未选择</div>
      <div id="badge">—</div>
      <div id="params"></div>
      <div class="row">
        <button id="save" disabled>存成图片</button>
        <button id="reset" class="ghost">重置视角</button>
      </div>
      <div id="note"></div>
      <div id="status"></div>
    </div>
  </main>
</div>
<script type="module" src="/src/app/gallery/main.js"></script>
</body>
</html>
